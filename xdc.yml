# =============================================================================
# XDC Docker - Primary Compose File
# =============================================================================
# XDC Network Mainnet RPC node (XDPoS consensus, EVM-compatible).
# Image: xinfinorg/xdposchain:${NODE_DOCKER_TAG}
# Source: https://github.com/XinFinOrg/XinFin-Node
# =============================================================================

services:
  # =============================================================================
  # One-shot snapshot download service
  # =============================================================================
  # Usage:
  #   docker compose --profile download run --rm download
  #
  # This service runs once to download and extract the blockchain snapshot.
  # It must be run BEFORE starting the main xdc service if using snapshots.
  # =============================================================================
  download:
    image: ${NODE_DOCKER_REPO}:${NODE_DOCKER_TAG}
    profiles: ["download"]
    user: root
    volumes:
      - xdc-data:/work/xdcchain
    working_dir: /work/xdcchain
    environment:
      SNAPSHOT_URL: ${SNAPSHOT_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${SNAPSHOT_URL}" ]; then
          echo "ERROR: SNAPSHOT_URL is empty"
          echo "Set SNAPSHOT_URL in your .env file to use this service"
          exit 1
        fi
        if [ -d XDC/chaindata ]; then
          echo "==> chaindata already exists; skipping snapshot download"
          exit 0
        fi
        echo "==> Downloading snapshot: $${SNAPSHOT_URL}"
        echo "==> This is a ~650GB file and may take several hours"
        wget --tries=0 --timeout=120 --read-timeout=120 --progress=dot:mega -O xdcchain.tar "$${SNAPSHOT_URL}"
        echo "==> Extracting snapshot (this may take 1-2 hours)"
        tar -xvzf xdcchain.tar || tar -xvf xdcchain.tar
        rm -f xdcchain.tar
        rm -f XDC/nodekey
        echo "==> Snapshot extraction complete"

  xdc:
    image: ${NODE_DOCKER_REPO}:${NODE_DOCKER_TAG}
    restart: unless-stopped
    stop_grace_period: 5m
    user: root
    volumes:
      - xdc-data:/work/xdcchain
      - ./start-node.sh:/work/start.sh:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      NETWORK: ${NETWORK:-mainnet}
      SYNC_MODE: ${SYNC_MODE:-full}
      GC_MODE: ${GC_MODE:-full}
      LOG_LEVEL: ${LOG_LEVEL:-3}
      P2P_PORT: ${P2P_PORT:-30303}
      RPC_PORT: ${RPC_PORT:-8545}
      WS_PORT: ${WS_PORT:-8546}
      GENESIS_URL: ${GENESIS_URL}
      SNAPSHOT_URL: ${SNAPSHOT_URL:-}
      XDC_BOOTNODES: ${XDC_BOOTNODES:-}
      EXTRA_ARGS: ${EXTRA_ARGS:-}
    ports:
      - ${P2P_PORT:-30303}:${P2P_PORT:-30303}/tcp
      - ${P2P_PORT:-30303}:${P2P_PORT:-30303}/udp
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOCKER_EXT_NETWORK}

      - traefik.http.routers.${RPC_HOST}.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST}.rule=Host(`${RPC_HOST}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST}.tls.certresolver=letsencrypt
      - traefik.http.routers.${RPC_HOST}.service=${RPC_LB}
      - traefik.http.services.${RPC_LB}.loadbalancer.server.port=${RPC_PORT:-8545}

      - traefik.http.routers.${WS_HOST}.entrypoints=websecure
      - traefik.http.routers.${WS_HOST}.rule=Host(`${WS_HOST}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST}.tls.certresolver=letsencrypt
      - traefik.http.routers.${WS_HOST}.service=${WS_LB}
      - traefik.http.services.${WS_LB}.loadbalancer.server.port=${WS_PORT:-8546}

      - metrics.scrape=false
      - metrics.network=${NETWORK:-mainnet}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${RPC_PORT:-8545}'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  xdc-data:
